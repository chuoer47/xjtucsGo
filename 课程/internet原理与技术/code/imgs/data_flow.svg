<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#333" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="500" fill="#fff"/>

  <text x="550" y="30" font-family="Arial" font-size="18" text-anchor="middle">Data Send / ACK / SACK Detailed Flow</text>

  <!-- Swimlanes -->
  <rect x="40" y="60" width="1020" height="180" fill="#F7FBFF" stroke="#ddd"/>
  <rect x="40" y="260" width="1020" height="180" fill="#FFF9F2" stroke="#ddd"/>
  <text x="60" y="85" font-family="Arial" font-size="13" font-weight="bold">Sender (rawtcp_server)</text>
  <text x="60" y="285" font-family="Arial" font-size="13" font-weight="bold">Receiver (TCP client)</text>

  <!-- Sender steps -->
  <rect x="80" y="110" width="160" height="70" rx="8" ry="8" fill="#E8F0FE" stroke="#333"/>
  <text x="160" y="140" font-family="Arial" font-size="12" text-anchor="middle">Check window</text>
  <text x="160" y="156" font-family="Arial" font-size="12" text-anchor="middle">peer_window_bytes</text>

  <rect x="280" y="110" width="160" height="70" rx="8" ry="8" fill="#E8F0FE" stroke="#333"/>
  <text x="360" y="140" font-family="Arial" font-size="12" text-anchor="middle">Send data seg</text>
  <text x="360" y="156" font-family="Arial" font-size="12" text-anchor="middle">(MSS limited)</text>

  <rect x="480" y="110" width="160" height="70" rx="8" ry="8" fill="#E8F0FE" stroke="#333"/>
  <text x="560" y="140" font-family="Arial" font-size="12" text-anchor="middle">Track inflight</text>
  <text x="560" y="156" font-family="Arial" font-size="12" text-anchor="middle">seq/len/ts</text>

  <rect x="680" y="110" width="160" height="70" rx="8" ry="8" fill="#E8F0FE" stroke="#333"/>
  <text x="760" y="140" font-family="Arial" font-size="12" text-anchor="middle">Wait ACK/SACK</text>

  <!-- Timeout / retransmit block - 调整位置使其完全显示 -->
  <rect x="880" y="90" width="170" height="100" rx="8" ry="8" fill="#FDECEA" stroke="#333"/>
  <text x="965" y="120" font-family="Arial" font-size="12" text-anchor="middle">Timeout check</text>
  <text x="965" y="136" font-family="Arial" font-size="12" text-anchor="middle">(per inflight)</text>
  <text x="965" y="152" font-family="Arial" font-size="12" text-anchor="middle">SACK: skip sacked</text>
  <text x="965" y="168" font-family="Arial" font-size="12" text-anchor="middle">GBN: resend all</text>

  <!-- Receiver steps -->
  <rect x="170" y="310" width="190" height="70" rx="8" ry="8" fill="#FFF4E5" stroke="#333"/>
  <text x="265" y="340" font-family="Arial" font-size="12" text-anchor="middle">Receive segment</text>
  <text x="265" y="356" font-family="Arial" font-size="12" text-anchor="middle">(may be out-of-order)</text>

  <rect x="400" y="310" width="190" height="70" rx="8" ry="8" fill="#FFF4E5" stroke="#333"/>
  <text x="495" y="340" font-family="Arial" font-size="12" text-anchor="middle">Build ACK</text>
  <text x="495" y="356" font-family="Arial" font-size="12" text-anchor="middle">+ optional SACK blocks</text>

  <rect x="630" y="310" width="190" height="70" rx="8" ry="8" fill="#FFF4E5" stroke="#333"/>
  <text x="725" y="340" font-family="Arial" font-size="12" text-anchor="middle">Send ACK/SACK</text>

  <!-- Arrows within sender lane -->
  <line x1="240" y1="145" x2="280" y2="145" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="145" x2="480" y2="145" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="145" x2="680" y2="145" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="840" y1="145" x2="880" y2="145" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrows within receiver lane -->
  <line x1="360" y1="345" x2="400" y2="345" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="345" x2="630" y2="345" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cross-lane arrows -->
  <line x1="360" y1="180" x2="265" y2="310" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="240" font-family="Arial" font-size="11">DATA</text>

  <line x1="725" y1="310" x2="760" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="790" y="240" font-family="Arial" font-size="11">ACK/SACK</text>

  <!-- Legend -->
  <rect x="60" y="420" width="20" height="12" fill="#E8F0FE" stroke="#333"/>
  <text x="90" y="430" font-family="Arial" font-size="11">Sender logic</text>
  <rect x="200" y="420" width="20" height="12" fill="#FFF4E5" stroke="#333"/>
  <text x="230" y="430" font-family="Arial" font-size="11">Receiver logic</text>
  <rect x="350" y="420" width="20" height="12" fill="#FDECEA" stroke="#333"/>
  <text x="380" y="430" font-family="Arial" font-size="11">Retransmit policy</text>
</svg>