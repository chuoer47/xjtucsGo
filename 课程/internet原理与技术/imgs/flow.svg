<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320">
  <defs>
    <style>
      .title { font: 600 20px 'Helvetica Neue', Arial, sans-serif; fill: #111827; }
      .label { font: 600 12px 'Helvetica Neue', Arial, sans-serif; fill: #0f172a; }
      .note { font: 11px 'Helvetica Neue', Arial, sans-serif; fill: #475569; }
      .step { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 1.2; }
      .accent { fill: #EEF2FF; stroke: #6366F1; }
      .accent2 { fill: #ECFDF3; stroke: #22C55E; }
      .accent3 { fill: #FFF7ED; stroke: #F97316; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#334155" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1100" height="320" fill="#ffffff"/>
  <text x="550" y="40" class="title" text-anchor="middle">Handshake + Download + Teardown Flow</text>

  <g filter="url(#shadow)">
    <!-- 第一行：握手阶段 -->
    <rect x="80"  y="90" width="90" height="60" rx="10" class="step accent"/>
    <text x="125" y="125" class="label" text-anchor="middle">SYN</text>

    <rect x="190" y="90" width="110" height="60" rx="10" class="step accent"/>
    <text x="245" y="117" class="label" text-anchor="middle">SYN+ACK</text>
    <text x="245" y="135" class="note" text-anchor="middle">MSS/WS/SACK</text>

    <rect x="320" y="90" width="90" height="60" rx="10" class="step accent"/>
    <text x="365" y="125" class="label" text-anchor="middle">ACK</text>

    <!-- 第二行：数据传输和断开阶段 -->
    <rect x="80"  y="180" width="130" height="60" rx="10" class="step"/>
    <text x="145" y="215" class="label" text-anchor="middle">GET &lt;file&gt;</text>

    <rect x="230" y="180" width="110" height="60" rx="10" class="step"/>
    <text x="285" y="215" class="label" text-anchor="middle">RESP HDR</text>

    <rect x="360" y="180" width="100" height="60" rx="10" class="step accent2"/>
    <text x="410" y="215" class="label" text-anchor="middle">DATA</text>

    <rect x="480" y="180" width="110" height="60" rx="10" class="step accent2"/>
    <text x="535" y="215" class="label" text-anchor="middle">ACK/SACK</text>

    <rect x="610" y="180" width="80" height="60" rx="10" class="step accent3"/>
    <text x="650" y="215" class="label" text-anchor="middle">FIN</text>

    <rect x="710" y="180" width="80" height="60" rx="10" class="step accent3"/>
    <text x="750" y="215" class="label" text-anchor="middle">ACK</text>
  </g>

  <!-- 第一行箭头：握手流程 -->
  <line x1="170" y1="120" x2="190" y2="120" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="120" x2="320" y2="120" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- 行间箭头：握手 -> 数据传输 -->
  <line x1="365" y1="150" x2="365" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- 第二行箭头：数据传输流程（修正箭头位置，精准对齐） -->
  <line x1="210" y1="210" x2="230" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="210" x2="360" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- 核心修正：DATA到ACK/SACK的箭头，x坐标从480改为460，精准对准 -->
  <line x1="460" y1="210" x2="480" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="210" x2="610" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="210" x2="710" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="550" y="280" class="note" text-anchor="middle">注：Window Scale 仅在握手协商；SACK 仅在 ACK 中携带块信息。</text>
</svg>