<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <defs>
    <style>
      .title { font: 600 20px 'Helvetica Neue', Arial, sans-serif; fill: #111827; }
      .label { font: 600 14px 'Helvetica Neue', Arial, sans-serif; fill: #0f172a; }
      .note { font: 12px 'Helvetica Neue', Arial, sans-serif; fill: #475569; }
      .box { fill: #F8FAFC; stroke: #94A3B8; stroke-width: 1.5; }
      .accent { fill: #E0F2FE; stroke: #38BDF8; }
      .accent2 { fill: #FEF3C7; stroke: #F59E0B; }
      .accent3 { fill: #DCFCE7; stroke: #22C55E; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <text x="500" y="42" class="title" text-anchor="middle">Raw TCP Server State Machine</text>

  <!-- Nodes -->
  <g filter="url(#shadow)">
    <rect x="90" y="120" width="190" height="80" rx="12" class="box accent"/>
    <text x="185" y="156" class="label" text-anchor="middle">LISTEN</text>
    <text x="185" y="176" class="note" text-anchor="middle">等待 SYN</text>

    <rect x="340" y="120" width="210" height="80" rx="12" class="box"/>
    <text x="445" y="156" class="label" text-anchor="middle">SYN_RECEIVED</text>
    <text x="445" y="176" class="note" text-anchor="middle">SYN+ACK 发送</text>

    <rect x="630" y="120" width="210" height="80" rx="12" class="box accent3"/>
    <text x="735" y="156" class="label" text-anchor="middle">ESTABLISHED</text>
    <text x="735" y="176" class="note" text-anchor="middle">传输/重传</text>

    <rect x="630" y="300" width="210" height="80" rx="12" class="box accent2"/>
    <text x="735" y="336" class="label" text-anchor="middle">FIN_WAIT</text>
    <text x="735" y="356" class="note" text-anchor="middle">等待对端 FIN</text>

    <rect x="340" y="300" width="210" height="80" rx="12" class="box"/>
    <text x="445" y="336" class="label" text-anchor="middle">CLOSED</text>
    <text x="445" y="356" class="note" text-anchor="middle">重置/释放</text>
  </g>

  <!-- Transitions -->
  <line x1="280" y1="160" x2="340" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="310" y="140" class="note" text-anchor="middle">SYN</text>

  <line x1="550" y1="160" x2="630" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="140" class="note" text-anchor="middle">ACK</text>

  <line x1="735" y1="200" x2="735" y2="300" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="760" y="250" class="note" text-anchor="start">发送 FIN</text>

  <line x1="630" y1="340" x2="550" y2="340" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="320" class="note" text-anchor="middle">ACK + FIN</text>

  <line x1="445" y1="300" x2="445" y2="200" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="468" y="245" class="note" text-anchor="start">重置</text>

  <!-- Footer legend -->
  <rect x="90" y="430" width="16" height="10" fill="#E0F2FE" stroke="#38BDF8"/>
  <text x="115" y="440" class="note">控制状态</text>
  <rect x="210" y="430" width="16" height="10" fill="#DCFCE7" stroke="#22C55E"/>
  <text x="235" y="440" class="note">数据传输</text>
  <rect x="330" y="430" width="16" height="10" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="355" y="440" class="note">关闭流程</text>
</svg>
